<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' wsmedia:; img-src 'self' wsmedia: data:; media-src 'self' wsmedia:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wsmedia:;"
    />
    <title>WinScreen</title>
    <link rel="stylesheet" href="wsmedia://app/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── 标题栏 ─────────────────────────────────────────── -->
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">WinScreen</span>
          <span class="brand-sub">桌面动态壁纸</span>
        </div>
        <div class="titlebar-drag"></div>
        <div class="window-controls">
          <button id="btn-minimize" class="wc-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button id="btn-maximize" class="wc-btn" title="最大化" aria-label="最大化">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button id="btn-close" class="wc-btn wc-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
        </div>
      </header>

      <div class="body">
        <!-- ── 侧边导航 ────────────────────────────────────── -->
        <aside class="sidebar">
          <nav class="nav">
            <button class="nav-item is-active" data-view="library">
              <svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="9" rx="1.6" /><path d="M4.5 16h11" /></svg>
              <span>素材库</span>
              <em id="nav-count-library" class="nav-badge">0</em>
            </button>
            <button class="nav-item" data-view="online">
              <svg viewBox="0 0 20 20"><path d="M10 3v9m0 0l-3.2-3.2M10 12l3.2-3.2" /><path d="M3.5 14.5v1.2a1.3 1.3 0 001.3 1.3h10.4a1.3 1.3 0 001.3-1.3v-1.2" /></svg>
              <span>在线素材</span>
            </button>
            <button class="nav-item" data-view="settings">
              <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" /><path d="M10 2.6v1.8M10 15.6v1.8M17.4 10h-1.8M4.4 10H2.6M15.2 4.8l-1.3 1.3M6.1 13.9l-1.3 1.3M15.2 15.2l-1.3-1.3M6.1 6.1L4.8 4.8" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <div class="sidebar-status">
            <div class="status-line">
              <span class="status-dot" id="status-dot"></span>
              <span id="status-text">空闲</span>
            </div>
            <div class="status-meta" id="status-meta">尚未应用动态壁纸</div>
            <div class="status-hint" id="status-hint"></div>
          </div>
        </aside>

        <!-- ── 主内容区 ────────────────────────────────────── -->
        <main class="content">
          <!-- 素材库 -->
          <section class="view is-active" id="view-library">
            <div class="toolbar">
              <div class="search">
                <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4" /><path d="M10.4 10.4L14 14" /></svg>
                <input id="search" type="search" placeholder="搜索标题或标签…" autocomplete="off" />
              </div>
              <div class="chips" id="chips"></div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" id="btn-refresh" title="重新扫描素材目录">
                  <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 11-1.7-4" /><path d="M13.6 2.2v3.2h-3.2" /></svg>
                  刷新
                </button>
                <button class="btn btn-primary" id="btn-add">
                  <svg viewBox="0 0 16 16"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
                  添加视频
                </button>
              </div>
            </div>

            <div class="scroll-area">
              <div class="grid" id="grid"></div>
              <div class="empty" id="empty-library" hidden>
                <div class="empty-icon">
                  <svg viewBox="0 0 48 48"><rect x="6" y="10" width="36" height="22" rx="3" /><path d="M12 38h24" /><path d="M21 19l8 5-8 5z" /></svg>
                </div>
                <h3>素材库还是空的</h3>
                <p>点击「添加视频」导入本地动态壁纸，或者到「在线素材」下载内置素材库。</p>
                <div class="empty-actions">
                  <button class="btn btn-primary" data-action="add">添加视频</button>
                  <button class="btn btn-ghost" data-action="goto-online">去看看在线素材</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 在线素材 -->
          <section class="view" id="view-online">
            <div class="toolbar">
              <div class="toolbar-title">
                <h2>在线素材</h2>
                <p id="online-subtitle">来自原作者素材仓库，下载后自动导入本地素材库</p>
              </div>
              <div class="toolbar-actions">
                <button class="btn btn-ghost" id="btn-online-refresh">检查更新</button>
                <button class="btn btn-ghost" id="btn-online-page">打开 GitHub 目录</button>
              </div>
            </div>
            <div class="scroll-area">
              <div class="online-list" id="online-list"></div>
              <div class="empty" id="empty-online" hidden>
                <h3>没有读到素材清单</h3>
                <p>assets/materials.json 缺失，可以执行 npm run materials 重新生成。</p>
              </div>
            </div>
          </section>

          <!-- 设置 -->
          <section class="view" id="view-settings">
            <div class="toolbar">
              <div class="toolbar-title">
                <h2>设置</h2>
                <p>所有选项即时生效并持久化到本地</p>
              </div>
            </div>
            <div class="scroll-area">
              <div class="settings" id="settings"></div>
            </div>
          </section>
        </main>

        <!-- ── 详情面板 ────────────────────────────────────── -->
        <aside class="detail" id="detail">
          <div class="detail-empty" id="detail-empty">
            <p>选中一个素材查看详情</p>
          </div>
          <div class="detail-body" id="detail-body" hidden>
            <div class="detail-preview">
              <video id="detail-video" muted loop playsinline preload="metadata"></video>
              <div class="detail-preview-badge" id="detail-badge">预览</div>
            </div>
            <h3 class="detail-title" id="detail-title">—</h3>
            <div class="detail-tags" id="detail-tags"></div>
            <dl class="detail-meta" id="detail-meta"></dl>
            <div class="detail-actions">
              <button class="btn btn-primary btn-block" id="btn-apply">应用到桌面</button>
              <div class="detail-actions-row">
                <button class="btn btn-ghost" id="btn-favorite">收藏</button>
                <button class="btn btn-ghost" id="btn-reveal">打开位置</button>
              </div>
              <button class="btn btn-danger btn-block" id="btn-delete">删除素材</button>
            </div>
          </div>
        </aside>
      </div>

      <!-- ── 底部播放条 ──────────────────────────────────── -->
      <footer class="playerbar">
        <div class="player-info">
          <span class="player-label">当前壁纸</span>
          <span class="player-title" id="player-title">未播放</span>
        </div>
        <div class="player-controls">
          <button class="pb-btn" id="btn-prev-state" title="暂停 / 继续" disabled>
            <svg id="icon-playpause" viewBox="0 0 16 16"><path d="M5 3.5l8 4.5-8 4.5z" /></svg>
          </button>
          <button class="pb-btn" id="btn-next" title="下一个壁纸">
            <svg viewBox="0 0 16 16"><path d="M4 3.5l7 4.5-7 4.5z" /><path d="M12 3.5v9" /></svg>
          </button>
          <button class="pb-btn" id="btn-stop" title="停止播放">
            <svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.4" /></svg>
          </button>
        </div>
        <div class="player-volume">
          <button class="pb-btn pb-volume-icon" id="btn-mute" title="静音 / 取消静音">
            <svg id="icon-volume" viewBox="0 0 16 16"><path d="M3 6h2.4L8.5 3.4v9.2L5.4 10H3z" /><path d="M11 6.2a2.6 2.6 0 010 3.6" /></svg>
          </button>
          <input id="volume" type="range" min="0" max="100" value="0" />
          <span class="volume-value" id="volume-value">0%</span>
        </div>
      </footer>
    </div>

    <div class="toasts" id="toasts"></div>
    <div class="context-menu" id="context-menu" hidden></div>
    <div class="drop-overlay" id="drop-overlay" hidden><div>松开鼠标导入视频</div></div>

    <script src="wsmedia://app/app.js"></script>
  </body>
</html>
